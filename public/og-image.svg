<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="cyan-glow" cx="20%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="indigo-glow" cx="85%" cy="85%" r="55%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="top-line-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="transparent" />
      <stop offset="30%" stop-color="#0ea5e9" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="transparent" />
    </linearGradient>
    <linearGradient id="accent-text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.5" />
    </pattern>
  </defs>

  <!-- Deep Cosmic Canvas Background -->
  <rect width="1200" height="630" fill="#070b14" />
  <rect width="1200" height="630" fill="url(#grid)" />
  <rect width="1200" height="630" fill="url(#cyan-glow)" />
  <rect width="1200" height="630" fill="url(#indigo-glow)" />

  <!-- Outer Glass Frame -->
  <rect x="24" y="24" width="1152" height="582" rx="24" fill="#0f172a" fill-opacity="0.4" stroke="#334155" stroke-width="1.5" />
  
  <!-- Glowing Top Accent Line -->
  <path d="M 48 24 L 1152 24" stroke="url(#top-line-glow)" stroke-width="3" stroke-linecap="round" />

  <!-- Header: Logo & Title -->
  <g transform="translate(64, 64)">
    <!-- Logo Box -->
    <rect width="68" height="68" rx="18" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-opacity="0.6" stroke-width="1.5" />
    <!-- Radiation Icon SVG inside Logo -->
    <g transform="translate(14, 14)" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <circle cx="20" cy="20" r="2.5" fill="#f59e0b" />
      <path d="M23.33 25.77a6.67 6.67 0 0 1-6.67 0L12.55 32.91 A 1.67 1.67 0 0 0 13.32 35.27 16.67 16.67 0 0 0 26.68 35.27 1.67 1.67 0 0 0 27.45 32.91z" fill="#f59e0b" fill-opacity="0.4" />
      <path d="M26.67 20a6.67 6.67 0 0 0-3.33-5.77l4.12-7.14a1.67 1.67 0 0 1 2.43-.51 16.67 16.67 0 0 1 6.68 11.57A1.67 1.67 0 0 1 35 20z" fill="#f59e0b" fill-opacity="0.4" />
      <path d="M13.33 20a6.67 6.67 0 0 1 3.33-5.77L12.55 7.09a1.67 1.67 0 0 0-2.43-.51 16.67 16.67 0 0 0-6.68 11.57A1.67 1.67 0 0 0 5 20z" fill="#f59e0b" fill-opacity="0.4" />
    </g>

    <!-- Title and Subtitle -->
    <text x="86" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="900" fill="#ffffff" letter-spacing="-0.5">RadOnco <tspan fill="#f59e0b">CDSS</tspan></text>
    <text x="86" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#94a3b8" letter-spacing="2">CLINICAL DECISION SUPPORT SYSTEM</text>

    <!-- Medical Cockpit Badge -->
    <g transform="translate(760, 10)">
      <rect width="260" height="38" rx="19" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1.5" />
      <text x="130" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#fbbf24" text-anchor="middle" letter-spacing="1.5">⚛ HIGH-ACUITY MEDICAL COCKPIT</text>
    </g>
  </g>

  <!-- Central Headlines -->
  <g transform="translate(64, 210)">
    <text x="0" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="-1">Evidence-Based Radiation Oncology &amp;</text>
    <text x="0" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" fill="url(#accent-text)" letter-spacing="-1">Adaptive Dosimetry Portal</text>
    
    <text x="0" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="21" font-weight="400" fill="#94a3b8" width="980">
      Comprehensive 12-Organ Adaptive Clinical Decision Matrix, ICRU Target Volumes,
    </text>
    <text x="0" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="21" font-weight="400" fill="#94a3b8" width="980">
      QUANTEC/HyTEC OAR Ceilings &amp; BED/EQD2 Radiobiology Solvers.
    </text>
  </g>

  <!-- Bottom Badges & Official Domain -->
  <g transform="translate(64, 520)">
    <line x1="0" y1="0" x2="1072" y2="0" stroke="#334155" stroke-opacity="0.7" stroke-width="1" />
    
    <!-- Badges -->
    <g transform="translate(0, 22)">
      <g transform="translate(0, 0)">
        <rect width="144" height="34" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#475569" stroke-width="1" />
        <text x="72" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">NCCN v2025/2026</text>
      </g>
      <g transform="translate(156, 0)">
        <rect width="148" height="34" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#475569" stroke-width="1" />
        <text x="74" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">QUANTEC &amp; HyTEC</text>
      </g>
      <g transform="translate(316, 0)">
        <rect width="134" height="34" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#475569" stroke-width="1" />
        <text x="67" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">ICRU 50/62/83</text>
      </g>
      <g transform="translate(462, 0)">
        <rect width="124" height="34" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#475569" stroke-width="1" />
        <text x="62" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">Van Herk PTV</text>
      </g>
    </g>

    <!-- Domain -->
    <text x="1072" y="45" font-family="ui-monospace, monospace" font-size="18" font-weight="700" fill="#38bdf8" text-anchor="end">www.radoncoxia.pro</text>
  </g>
</svg>
